[project]
name = "gtm-prospecting-engine"
version = "0.2.0"
description = "ICP and signal driven prospecting: list building, CRM dedupe, waterfall enrichment, SDR tasks, dialer handoff"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = {text = "MIT"}

[project.scripts]
gtm = "gtm.cli:main"

[tool.setuptools.packages.find]
include = ["gtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
