name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Full mock run
        run: |
          python -m gtm list
          python -m gtm prospect --dry-run
          python -m gtm prospect --push-dialer
          python -m gtm prospect --push-dialer
          python -m gtm report
